services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-translate
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  webapp:
    build: .
    container_name: translate-webapp
    ports:
      - "8080:8080"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    restart: unless-stopped

  # One-time model download service
  model-init:
    image: curlimages/curl:latest
    container_name: model-init
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for Ollama to be ready..."
        sleep 5
        echo "Pulling translategemma:4b model (this may take a few minutes)..."
        curl -X POST http://ollama:11434/api/pull -d '{"name": "translategemma:4b"}' --no-buffer
        echo "Model download complete!"

volumes:
  ollama_data:
